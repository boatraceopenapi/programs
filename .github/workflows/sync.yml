name: Sync

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

concurrency:
  group: cron-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET_BRANCH: gh-pages

jobs:
  deploy-v3:
    name: Deploy bvp/scraper ^6.0 on PHP ${{ matrix.php-version }} (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version:
          - '8.4'
    steps:
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install dependencies (without scraper)
        run: |
          composer remove bvp/scraper --no-update || true
          composer install --prefer-dist --no-interaction --no-progress

      - name: Require bvp/scraper ^6.0
        run: |
          composer require bvp/scraper:^6.0 --no-update
          composer update bvp/scraper --with-dependencies
          composer install --prefer-dist --no-interaction --no-progress

      - name: Sync with remote JSON files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- composer.json composer.lock 2>/dev/null || true
          git pull --rebase origin "${TARGET_BRANCH}"

      - name: Sync JSON files
        run: php bin/sync.php v3

      - name: Validate JSON files
        id: validate
        run: |
          set -e
          FILES=$(
            {
              git ls-files -m -- 'docs/v3' | grep '\.json$'
              git diff --cached --name-only --diff-filter=AM -- 'docs/v3' | grep '\.json$'
              git ls-files --others --exclude-standard -- 'docs/v3' | grep '\.json$'
            } | sort -u
          )

          if [ -z "$FILES" ]; then
            echo "No JSON changes in docs/v3."
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "files_changed=true" >> "$GITHUB_OUTPUT"
          echo "$FILES" > /tmp/changed_files.txt

          if echo "$FILES" | xargs grep -l '^<<<<<<<\|^=======$\|^>>>>>>>' 2>/dev/null; then
            echo "::error::merge conflict markers found in generated JSON"
            exit 1
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error::invalid JSON: $f"
              exit 1
            fi
          done < /tmp/changed_files.txt

      - name: Commit JSON files
        if: steps.validate.outputs.files_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add $(cat /tmp/changed_files.txt)

          git commit -m "chore: deploy JSON files to docs/v3" || {
            echo "Nothing to commit."
            exit 0
          }

          git push origin HEAD:"${TARGET_BRANCH}" || (git pull --rebase origin "${TARGET_BRANCH}" && git push origin HEAD:"${TARGET_BRANCH}")

  deploy-v2:
    needs: deploy-v3
    name: Deploy bvp/scraper ^5.0 on PHP ${{ matrix.php-version }} (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version:
          - '8.4'
    steps:
      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Install dependencies (without scraper)
        run: |
          composer remove bvp/scraper --no-update || true
          composer install --prefer-dist --no-interaction --no-progress

      - name: Require bvp/scraper ^5.0
        run: |
          composer require bvp/scraper:^5.0 --no-update
          composer update bvp/scraper --with-dependencies
          composer install --prefer-dist --no-interaction --no-progress

      - name: Sync with remote JSON files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -- composer.json composer.lock 2>/dev/null || true
          git pull --rebase origin "${TARGET_BRANCH}"

      - name: Sync JSON files
        run: php bin/sync.php v2

      - name: Validate JSON files
        id: validate
        run: |
          set -e
          FILES=$(
            {
              git ls-files -m -- 'docs/v2' | grep '\.json$'
              git diff --cached --name-only --diff-filter=AM -- 'docs/v2' | grep '\.json$'
              git ls-files --others --exclude-standard -- 'docs/v2' | grep '\.json$'
            } | sort -u
          )

          if [ -z "$FILES" ]; then
            echo "No JSON changes in docs/v2."
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "files_changed=true" >> "$GITHUB_OUTPUT"
          echo "$FILES" > /tmp/changed_files.txt

          if echo "$FILES" | xargs grep -l '^<<<<<<<\|^=======$\|^>>>>>>>' 2>/dev/null; then
            echo "::error::merge conflict markers found in generated JSON"
            exit 1
          fi

          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if ! jq empty "$f" 2>/dev/null; then
              echo "::error::invalid JSON: $f"
              exit 1
            fi
          done < /tmp/changed_files.txt

      - name: Commit JSON files
        if: steps.validate.outputs.files_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add $(cat /tmp/changed_files.txt)

          git commit -m "chore: deploy JSON files to docs/v2" || {
            echo "Nothing to commit."
            exit 0
          }

          git push origin HEAD:"${TARGET_BRANCH}" || (git pull --rebase origin "${TARGET_BRANCH}" && git push origin HEAD:"${TARGET_BRANCH}")
